limit_req_zone $binary_remote_addr zone=airport_api:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=airport_auth:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=airport_conn:1m;

server {
    listen 5173;
    server_name airportdt.duckdns.org;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    limit_conn airport_conn 20;
    # Traefik appends its verified peer address. Use the last address, then
    # replace X-Forwarded-For before forwarding to the one-hop gateway.
    set_real_ip_from 172.19.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://api.mapbox.com https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.mapbox.com; connect-src 'self' wss://airportdt.duckdns.org https://*.mapbox.com https://events.mapbox.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    access_log off;
    error_log /dev/stderr warn;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location ~ /\. { return 404; }
    location ~* \.(env|sql|bak|map)$ { return 404; }
    location /auth/ {
        limit_req zone=airport_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=airport_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 35s;
    }
    location = /ws {
        limit_req zone=airport_auth burst=5 nodelay;
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
