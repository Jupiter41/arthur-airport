server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/**/*.log
    pipeline_stages:
      # Docker JSON log driver wraps each line in {"log":"...","stream":"...","time":"..."}
      - docker: {}
      # Extract container name from file path
      - regex:
          source: filename
          expression: "/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/"
      - labels:
          container_id:
    pipeline_stages:
      # Try to parse JSON log lines (structlog output)
      - json:
          expressions:
            level: level
            trace_id: trace_id
            service_name: service
            event: event
      - labels:
          level:
          trace_id:
          service_name:
