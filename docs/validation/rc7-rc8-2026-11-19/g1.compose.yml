x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-python-service:
  logging: *id001
  restart: unless-stopped
  networks: &id002
  - art-net
  volumes:
  - ./services/_common:/app/_common:ro
  - ./config:/app/config:ro
  environment:
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: art-digital-twin
    KAFKA_BROKERS: kafka:9092
    LOG_LEVEL: INFO
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
services:
  neo4j:
    logging: *id001
    image: neo4j:5
    restart: unless-stopped
    networks:
    - art-net
    environment:
      NEO4J_AUTH: neo4j/art-digital-twin
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_db_tx__log_rotation_retention__policy: 256M size
      NEO4J_db_tx__log_rotation_size: 16M
      NEO4J_dbms_cypher_statistics__divergence__threshold: '0.9'
      NEO4J_dbms_cypher_min__replan__interval: 60s
    volumes:
    - neo4j-data:/data
    - neo4j-logs:/logs
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:7474
      interval: 10s
      timeout: 5s
      retries: 10
  zookeeper:
    logging: *id001
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    networks:
    - art-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
    volumes:
    - zookeeper-data:/var/lib/zookeeper/data
    - zookeeper-logs:/var/lib/zookeeper/log
  kafka:
    logging: *id001
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    networks:
    - art-net
    depends_on:
    - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_ROLL_MS: 3600000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10
  kafka-init:
    logging: *id001
    image: confluentinc/cp-kafka:7.6.0
    networks:
    - art-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/bash
    - -c
    command:
    - "echo \"Creating Kafka topics...\"\ntopics=(\n  \"sim.clock:1:1\"\n  \"flights.events:6:1\"\
      \n  \"flights.schedule:1:1\"\n  \"passengers.events:6:1\"\n  \"baggage.events:6:1\"\
      \n  \"weather.events:1:1\"\n  \"incidents.events:3:1\"\n  \"incidents.alerts:3:1\"\
      \n  \"incidents.inject:1:1\"\n  \"ground.events:3:1\"\n  \"analysis.events:3:1\"\
      \n  \"planning.events:1:1\"\n  \"flights.commands:6:1\"\n  \"passengers.commands:3:1\"\
      \n  \"baggage.commands:3:1\"\n  \"incidents.commands:3:1\"\n  \"cost.events:3:1\"\
      \n  \"sim.watermark:1:1\"\n)\nfor entry in \"$${topics[@]}\"; do\n  IFS=':'\
      \ read -r topic partitions replication <<< \"$$entry\"\n  kafka-topics --bootstrap-server\
      \ kafka:9092 \\\n    --create --if-not-exists \\\n    --topic \"$$topic\" \\\
      \n    --partitions \"$$partitions\" \\\n    --replication-factor \"$$replication\"\
      \ \\\n    && echo \"  \u2713 $$topic ($$partitions partitions)\" \\\n    ||\
      \ exit 1\ndone\necho \"All topics created.\"\n"
  flight-service:
    logging: *id001
    restart: unless-stopped
    networks: *id002
    volumes:
    - ${ARTHUR_REPO_ROOT}/services/_common:/app/_common:ro
    - ${ARTHUR_REPO_ROOT}/config:/app/config:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: flight-service
      ADSB_ENABLED: 'false'
      OPENSKY_USERNAME: ${OPENSKY_USERNAME:-}
      OPENSKY_PASSWORD: ${OPENSKY_PASSWORD:-}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8001/health
      interval: 10s
      timeout: 5s
      retries: 5
    image: art-ldt-g6-flight-service:latest
  passenger-service:
    logging: *id001
    restart: unless-stopped
    networks: *id002
    volumes:
    - ${ARTHUR_REPO_ROOT}/services/_common:/app/_common:ro
    - ${ARTHUR_REPO_ROOT}/config:/app/config:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: passenger-service
      PASSENGER_SOURCE: simulation
      PASSENGER_BTS_FILE: /app/data/bts/T100_reference.csv
      AIRPORT_IATA: ART
      AIRPORT_ICAO: KART
      MODELS_PATH: /app/ml-artifacts/models
      TRAINING_DATA_PATH: /app/ml-artifacts/training_data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8002/health
      interval: 10s
      timeout: 5s
      retries: 5
    image: art-ldt-g6-passenger-service:latest
  baggage-service:
    logging: *id001
    restart: unless-stopped
    networks: *id002
    volumes:
    - ${ARTHUR_REPO_ROOT}/services/_common:/app/_common:ro
    - ${ARTHUR_REPO_ROOT}/config:/app/config:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: baggage-service
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8003/health
      interval: 10s
      timeout: 5s
      retries: 5
    image: art-ldt-g6-baggage-service:latest
  analysis-service:
    logging: *id001
    restart: unless-stopped
    networks: *id002
    volumes:
    - ${ARTHUR_REPO_ROOT}/services/_common:/app/_common:ro
    - ${ARTHUR_REPO_ROOT}/config:/app/config:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: analysis-service
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      RL_MODEL_PATH: ${RL_MODEL_PATH:-/app/artifacts/rl_policy.zip}
      TRAINING_ARTIFACTS_DIR: /app/artifacts
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8007/health
      interval: 10s
      timeout: 5s
      retries: 5
    image: art-ldt-g6-analysis-service:latest
  sim-orchestrator:
    logging: *id001
    restart: unless-stopped
    networks: *id002
    volumes:
    - ${ARTHUR_REPO_ROOT}/services/_common:/app/_common:ro
    - ${ARTHUR_REPO_ROOT}/config:/app/config:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: sim-orchestrator
      AIRPORT_CONFIG_PATH: /app/config/airport.yaml
      SIM_SPEED_MULTIPLIER: 60
      SIM_START_TIME: '2024-06-15T06:00:00Z'
      DAILY_FLIGHT_TARGET: 420
      DAILY_LOAD_FACTOR_MEAN: 0.8
      INCIDENT_SOURCE: simulated
      BTS_CSV_PATH: /app/data/bts/T100_reference.csv
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8006/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    image: art-ldt-g6-sim-orchestrator:latest
networks:
  art-net:
    driver: bridge
volumes:
  analysis-artifacts: null
  passenger-ml: null
  neo4j-data: null
  neo4j-logs: null
  zookeeper-data: null
  zookeeper-logs: null
  kafka-data: null
  prometheus-data: null
  grafana-data: null
  loki-data: null
