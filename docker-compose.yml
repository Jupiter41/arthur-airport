name: arthur-airport

x-python-service: &python-service
  restart: unless-stopped
  networks:
    - art-net
  environment:
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: art-digital-twin
    KAFKA_BROKERS: kafka:9092
    LOG_LEVEL: INFO

services:
  # ─── Infrastructure ────────────────────────────────────────────

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/art-digital-twin
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    networks: [art-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: art-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    networks: [art-net]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        topics=(
          "sim.clock:1:1"
          "flights.events:6:1"
          "flights.schedule:1:1"
          "passengers.events:6:1"
          "baggage.events:6:1"
          "weather.events:1:1"
          "incidents.events:3:1"
          "incidents.alerts:3:1"
          "incidents.inject:1:1"
        )
        for entry in "$${topics[@]}"; do
          IFS=':' read -r topic partitions replication <<< "$$entry"
          kafka-topics --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions "$$partitions" \
            --replication-factor "$$replication" \
            && echo "  ✓ $$topic ($$partitions partitions)" \
            || echo "  ✗ $$topic failed"
        done
        echo "All topics created."

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]

  # ─── Domain services ───────────────────────────────────────────

  flight-service:
    <<: *python-service
    build: ./services/flight-service
    ports:
      - "8001:8001"
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  passenger-service:
    <<: *python-service
    build: ./services/passenger-service
    ports:
      - "8002:8002"
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  baggage-service:
    <<: *python-service
    build: ./services/baggage-service
    ports:
      - "8003:8003"
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather-service:
    <<: *python-service
    build: ./services/weather-service
    ports:
      - "8004:8004"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      INITIAL_WEATHER_CATEGORY: CAVOK
      METAR_INTERVAL_SIM_MINUTES: 30
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  incident-service:
    <<: *python-service
    build: ./services/incident-service
    ports:
      - "8005:8005"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      CASCADE_MAX_DEPTH: 5
      PROB_RUNWAY_INCURSION_PER_HR: 0.005
      PROB_BAGGAGE_FIRE_PER_HR: 0.008
      PROB_SECURITY_BREACH_PER_HR: 0.010
      PROB_SYSTEM_FAILURE_PER_HR: 0.015
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sim-orchestrator:
    <<: *python-service
    build: ./services/sim-orchestrator
    ports:
      - "8006:8006"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: art-digital-twin
      KAFKA_BROKERS: kafka:9092
      SIM_SPEED_MULTIPLIER: 60
      SIM_START_TIME: "2024-06-15T06:00:00Z"
      DAILY_FLIGHT_TARGET: 420
      DAILY_LOAD_FACTOR_MEAN: 0.80
    depends_on:
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
      baggage-service:
        condition: service_healthy
      weather-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: art-digital-twin-dev
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: api-gateway
      FLIGHT_SERVICE_URL: http://flight-service:8001
      PASSENGER_SERVICE_URL: http://passenger-service:8002
      BAGGAGE_SERVICE_URL: http://baggage-service:8003
      WEATHER_SERVICE_URL: http://weather-service:8004
      INCIDENT_SERVICE_URL: http://incident-service:8005
      SIM_ORCHESTRATOR_URL: http://sim-orchestrator:8006
      NODE_ENV: development
    depends_on:
      kafka:
        condition: service_healthy
      sim-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboards/art-dashboard
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000/ws
    depends_on:
      api-gateway:
        condition: service_healthy

  # ─── Observability ─────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - flight-service
      - passenger-service
      - baggage-service
      - weather-service
      - incident-service
      - sim-orchestrator
      - api-gateway

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    networks: [art-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: art-grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sim-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

# ─── Networks & volumes ──────────────────────────────────────────

networks:
  art-net:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  prometheus-data:
  grafana-data:
