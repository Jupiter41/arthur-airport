apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: arthur-airport
  labels:
    app.kubernetes.io/part-of: arthur-airport
data:
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  KAFKA_BROKERS: "kafka:9092"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  OTEL_ENABLED: "true"
---
