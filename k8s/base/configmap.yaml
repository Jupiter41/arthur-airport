  name: shared-secrets
  namespace: arthur-airport
  labels:
    app.kubernetes.io/part-of: arthur-airport
type: Opaque
stringData:
  NEO4J_PASSWORD: "art-digital-twin"
  JWT_SECRET: "art-digital-twin-dev"
  GRAFANA_PASSWORD: "art-grafana"
