# Domain service Deployments + Services + HPAs
# All services follow the same pattern: Deployment + ClusterIP Service + HPA

---
# flight-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: arthur-airport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      labels:
        app: flight-service
    spec:
      containers:
        - name: flight-service
          image: arthur-airport/flight-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: shared-config
            - secretRef:
                name: shared-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "flight-service"
            - name: ADSB_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flight-service
  namespace: arthur-airport
spec:
  selector:
    app: flight-service
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-service
  namespace: arthur-airport
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

