              value: "http://api-gateway:3000"
            - name: VITE_WS_URL
              value: "ws://api-gateway:3000/ws"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: arthur-airport
spec:
  type: LoadBalancer
  selector:
    app: dashboard
  ports:
    - port: 5173
      targetPort: 5173
