apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-service
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: cost-service
    app.kubernetes.io/part-of: arthur-airport
    app.kubernetes.io/component: domain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-service
  template:
    metadata:
      labels:
        app: cost-service
        app.kubernetes.io/name: cost-service
        app.kubernetes.io/part-of: arthur-airport
    spec:
      containers:
        - name: cost-service
          image: arthur-airport/cost-service:latest
          ports:
            - containerPort: 8008
          envFrom:
            - configMapRef:
                name: shared-config
            - secretRef:
                name: shared-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "cost-service"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cost-service
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: cost-service
    app.kubernetes.io/part-of: arthur-airport
spec:
  selector:
    app: cost-service
  ports:
    - port: 8008
      targetPort: 8008
