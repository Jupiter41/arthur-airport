apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: arthur-airport
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: arthur-airport
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: arthur-airport
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
