apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: arthur-airport
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: arthur-airport
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: GRAFANA_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: arthur-airport
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
