apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: arthur-airport
    app.kubernetes.io/component: messaging
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: arthur-airport
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: zk-data
              mountPath: /var/lib/zookeeper/data
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - echo ruok | nc localhost 2181 | grep imok
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: zk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: arthur-airport
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: arthur-airport
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
