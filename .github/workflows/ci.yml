name: CI — Arthur International Airport Digital Twin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint ─────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint all Python services
        run: |
          ruff check services/flight-service/
          ruff check services/passenger-service/
          ruff check services/baggage-service/
          ruff check services/weather-service/
          ruff check services/incident-service/
          ruff check services/sim-orchestrator/
          ruff check services/analysis-service/
          ruff check services/cost-service/
          ruff check services/planning-service/

  lint-node:
    name: Lint & build Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install gateway dependencies
        working-directory: services/api-gateway
        run: npm ci
      - name: Build gateway (TypeScript)
        working-directory: services/api-gateway
        run: npx tsc --noEmit
      - name: Install dashboard dependencies
        working-directory: dashboards/art-dashboard
        run: npm ci
      - name: Build dashboard (TypeScript + Vite)
        working-directory: dashboards/art-dashboard
        run: npx tsc && npx vite build

  # ── Unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -r services/flight-service/requirements.txt
          pip install -r services/passenger-service/requirements.txt
          pip install -r services/baggage-service/requirements.txt
          pip install -r services/weather-service/requirements.txt
          pip install -r services/incident-service/requirements.txt
          pip install -r services/sim-orchestrator/requirements.txt
          pip install -r services/analysis-service/requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  # ── Integration tests ──────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint-python, unit-tests]
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/art-digital-twin
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: ""
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r services/flight-service/requirements.txt
      - name: Run integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: art-digital-twin
          KAFKA_BROKERS: localhost:9092
        run: python -m pytest tests/integration/ -v --tb=short || true

  # ── Build ──────────────────────────────────────────────────
  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [lint-python, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build all containers
        run: docker compose build
      - name: Verify images created
        run: docker compose config --services | wc -l

  # ── End-to-end smoke test ──────────────────────────────────
  e2e-smoke-test:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx requests
      - name: Start infrastructure + services
        run: |
          docker compose up -d neo4j zookeeper kafka cost-service planning-service sim-orchestrator
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8008/health > /dev/null 2>&1 && \
               curl -sf http://localhost:8009/health > /dev/null 2>&1; then
              echo "Services healthy after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Run smoke test
        run: python -m pytest tests/integration/test_e2e_smoke.py -v --tb=short
        timeout-minutes: 5
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
