name: CI — Arthur International Airport Digital Twin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint ─────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.9
      - name: Lint all Python services
        run: |
          ruff check services/_common/
          ruff check tests/live_transactions/
          ruff check services/flight-service/
          ruff check services/passenger-service/
          ruff check services/baggage-service/
          ruff check services/weather-service/
          ruff check services/incident-service/
          ruff check services/sim-orchestrator/
          ruff check services/analysis-service/
          ruff check services/cost-service/
          ruff check services/planning-service/

  lint-node:
    name: Lint & build Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install gateway dependencies
        working-directory: services/api-gateway
        run: npm ci
      - name: Build gateway (TypeScript)
        working-directory: services/api-gateway
        run: npx tsc --noEmit
      - name: Install dashboard dependencies
        working-directory: dashboards/art-dashboard
        run: npm ci
      - name: Build dashboard (TypeScript + Vite)
        working-directory: dashboards/art-dashboard
        run: npx tsc && npx vite build
      - name: Run dashboard tests
        working-directory: dashboards/art-dashboard
        run: npm test

  # ── Gateway tests ──────────────────────────────────────────
  gateway-tests:
    name: Gateway tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install gateway dependencies
        working-directory: services/api-gateway
        run: npm ci
      - name: Run gateway unit tests
        working-directory: services/api-gateway
        run: npm test

  # ── Unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install "torch==2.13.0+cpu" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r services/flight-service/requirements.txt
          pip install -r services/passenger-service/requirements.txt
          pip install -r services/baggage-service/requirements.txt
          pip install -r services/weather-service/requirements.txt
          pip install -r services/incident-service/requirements.txt
          pip install -r services/sim-orchestrator/requirements.txt
          pip install -r services/analysis-service/requirements.txt
          pip install -r services/cost-service/requirements.txt
          pip install -r services/planning-service/requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  # The real Compose stack is required. Missing services/skipped tests fail.
  full-stack:
    name: Build and validate every service
    runs-on: ubuntu-latest
    needs: [lint-python, lint-node, gateway-tests, unit-tests]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration dependencies
        run: pip install pytest pytest-asyncio httpx requests neo4j
      - name: Build and start the full synthetic stack
        run: docker compose up -d --build
      - name: Require readiness and run all live integration tests
        run: python scripts/validate_stack.py --timeout 300 --report stack-readiness.json
        timeout-minutes: 15
      - name: Collect service status and logs
        if: always()
        run: |
          docker compose ps -a > stack-status.txt
          docker compose logs --no-color --tail=200 > stack-services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-validation
          path: |
            stack-readiness.json
            stack-status.txt
            stack-services.log
      - name: Tear down disposable CI stack
        if: always()
        run: docker compose down -v

  # G1 uses an infra-only disposable database: owners are independent workers,
  # so a background consumer/outbox cannot hide an injected crash or drain facts.
  domain-transactions:
    name: G1 domain crash, fencing and Kafka replay
    runs-on: ubuntu-latest
    needs: [lint-python, unit-tests]
    timeout-minutes: 35
    env:
      G1_DISPOSABLE_STACK: "1"
      REQUIRE_LIVE_STACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Build the three owning services
        run: docker compose build flight-service passenger-service baggage-service
      - name: Start disposable Neo4j and Kafka
        run: |
          docker compose up -d --wait neo4j kafka
          docker compose run --rm --no-deps kafka-init
      - name: Verify real transactions, process exits and acknowledged replay
        run: python -m pytest tests/live_transactions -q --tb=short --junitxml=g1-transactions.xml
      - name: Collect G1 service status and infrastructure logs
        if: always()
        run: |
          docker compose ps -a > g1-stack-status.txt
          docker compose logs --no-color --tail=200 > g1-stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-domain-transactions
          path: |
            g1-transactions.xml
            g1-stack-status.txt
            g1-stack.log
      - name: Tear down disposable G1 stack
        if: always()
        run: docker compose down -v
