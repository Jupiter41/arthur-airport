name: CI — Arthur International Airport Digital Twin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lint ─────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint all Python services
        run: |
          ruff check services/flight-service/
          ruff check services/passenger-service/
          ruff check services/baggage-service/
          ruff check services/weather-service/
          ruff check services/incident-service/
          ruff check services/sim-orchestrator/

  lint-node:
    name: Lint Node.js (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install gateway dependencies
        working-directory: services/api-gateway
        run: npm ci
      - name: Lint gateway
        working-directory: services/api-gateway
        run: npx eslint src/ --ext .ts || true
      - name: Install dashboard dependencies
        working-directory: dashboards/art-dashboard
        run: npm ci
      - name: Lint dashboard
        working-directory: dashboards/art-dashboard
        run: npx eslint src/ --ext .ts,.tsx || true

  # ── Unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  # ── Build ──────────────────────────────────────────────────
  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [lint-python, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build all containers
        run: docker compose build
      - name: Verify images created
        run: docker compose config --services | wc -l
