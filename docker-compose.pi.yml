name: arthur-airport-pi

x-limits: &limits
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
  labels: {traefik.enable: "false"}

x-environment: &environment
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
  NEO4J_POOL_SIZE: "5"
  NEO4J_POOL_TIMEOUT: "10"
  KAFKA_BROKERS: kafka:9092
  OTEL_ENABLED: "false"
  LOG_LEVEL: WARNING
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  ML_THREADS: "1"
  MALLOC_ARENA_MAX: "2"
  PYTHONDONTWRITEBYTECODE: "1"

x-python: &python
  <<: *limits
  user: "1000:1000"
  networks: [domain]
  environment: *environment
  mem_limit: 128m
  cpus: 0.5
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  volumes:
    - ./services/_common:/app/_common:ro
    - ./config:/app/config:ro
  depends_on:
    neo4j: {condition: service_healthy}
    kafka-init: {condition: service_completed_successfully}
  # Cold graph-cache reconstruction can exceed development startup probes.
  # Restart policies recover transient database timeouts within this budget.
  healthcheck:
    interval: 20s
    timeout: 5s
    retries: 12
    start_period: 180s

services:
  neo4j:
    <<: *limits
    image: neo4j:5.26-community
    networks: [domain]
    mem_limit: 640m
    cpus: 1.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_db_transaction_timeout: 15s
      NEO4J_server_config_strict__validation_enabled: "true"
    volumes: [neo4j-data:/data, neo4j-logs:/logs]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s

  kafka:
    <<: *limits
    image: apache/kafka:3.9.1
    networks: [domain]
    mem_limit: 512m
    cpus: 0.8
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 16777216
      KAFKA_LOG_SEGMENT_BYTES: 8388608
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infra/pi/kafka-health.sh:/health/kafka-health.sh:ro
    healthcheck:
      test: [CMD, /bin/bash, /health/kafka-health.sh]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 45s

  kafka-init:
    <<: *limits
    image: arthur-airport-pi-flight-service:latest
    restart: "no"
    networks: [domain]
    mem_limit: 192m
    cpus: 0.5
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: [python, /bootstrap/pi_kafka_init.py]
    volumes: [./scripts/pi_kafka_init.py:/bootstrap/pi_kafka_init.py:ro]
    healthcheck: {disable: true}

  flight-service:
    <<: *python
    build: ./services/flight-service
    environment:
      <<: *environment
      ADSB_ENABLED: "false"
  passenger-service:
    <<: *python
    build: ./services/passenger-service
    mem_limit: 320m
    environment:
      <<: *environment
      PASSENGER_SOURCE: simulation
      FORECAST_TRAINING_ENABLED: "false"
  baggage-service:
    <<: *python
    build: ./services/baggage-service
  weather-service:
    <<: *python
    build: ./services/weather-service
    environment:
      <<: *environment
      WEATHER_SOURCE: simulated
  incident-service:
    <<: *python
    build: ./services/incident-service
  sim-orchestrator:
    <<: *python
    build: ./services/sim-orchestrator
    mem_limit: 192m
    environment:
      <<: *environment
      AIRPORT_CONFIG_PATH: /app/config/airport.yaml
      SIM_SPEED_MULTIPLIER: "1"
      SIM_START_TIME: "2024-06-15T06:00:00Z"
      DAILY_FLIGHT_TARGET: "50"
      INCIDENT_SOURCE: simulated
    depends_on:
      flight-service: {condition: service_healthy}
      passenger-service: {condition: service_healthy}
      baggage-service: {condition: service_healthy}
      weather-service: {condition: service_healthy}
      incident-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8006/health]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s
  analysis-service:
    <<: *python
    build: {context: ./services/analysis-service, dockerfile: Dockerfile.pi}
    mem_limit: 256m
    environment:
      <<: *environment
      RL_MODEL_PATH: /disabled/rl-policy.zip
      MISTRAL_API_KEY: ""
      LLM_API_KEY: ""
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8007/health]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
  cost-service:
    <<: *python
    build: ./services/cost-service

  api-gateway:
    <<: *limits
    build: ./services/api-gateway
    user: node
    networks: [domain, frontend]
    mem_limit: 192m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      OTEL_ENABLED: "false"
      PUBLIC_DEPLOYMENT: "true"
      PUBLIC_ORIGIN: https://${AIRPORT_DOMAIN:-airportdt.duckdns.org}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AUTH_CLIENTS: ${AUTH_CLIENTS:?Set AUTH_CLIENTS}
      JWT_EXPIRES_IN: "3600"
      KAFKA_BROKERS: kafka:9092
      KAFKA_FRESHNESS_THRESHOLD_MS: "180000"
    depends_on:
      sim-orchestrator: {condition: service_healthy}
      cost-service: {condition: service_healthy}
      analysis-service: {condition: service_healthy}

  dashboard:
    <<: *limits
    build:
      context: ./dashboards/art-dashboard
      args: {VITE_PUBLIC_DEPLOYMENT: "true"}
    networks: [frontend, traefik-public]
    mem_limit: 64m
    cpus: 0.3
    read_only: true
    tmpfs: [/var/cache/nginx:size=8m, /var/run:size=1m, /tmp:size=8m]
    volumes: [./infra/pi/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: {api-gateway: {condition: service_healthy}}
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.airport.rule: Host(`${AIRPORT_DOMAIN:-airportdt.duckdns.org}`)
      traefik.http.routers.airport.entrypoints: websecure
      traefik.http.routers.airport.tls: "true"
      traefik.http.routers.airport.tls.certresolver: letsencrypt
      traefik.http.services.airport.loadbalancer.server.port: "5173"

networks:
  domain: {internal: true}
  frontend: {internal: true}
  traefik-public: {external: true}
volumes:
  neo4j-data:
  neo4j-logs:
  kafka-data:
