identity:
  name: "Arthur International Airport"
  iata: "ART"
  icao: "KART"
  timezone: "America/Arthur"

infrastructure:
  terminals: 3
  gates_per_terminal: [14, 14, 14]
  runways:
    - id: "09L/27R"
      length_m: 3500
      ils: true
    - id: "09R/27L"
      length_m: 3500
      ils: false

# 1C — accessibility & special assistance pool sizing.
# total_per_terminal: number of wheelchairs (and dispatch agents implied)
# sla_target_pct: ECAC Doc 30 — 90% of SA pax should reach the gate before
#                 the boarding cutoff (T-15 by default).
# boarding_cutoff_minutes: minutes before scheduled departure used as the SLA
#                          deadline for SA passengers reaching the gate.
accessibility:
  total_per_terminal: { A: 8, B: 12, C: 8 }
  sla_target_pct: 90.0
  boarding_cutoff_minutes: 15
  max_dispatch_wait_minutes: 30

simulation:
  daily_flight_target: 420
  load_factor_mean: 0.80
  peak_hours: [7, 8, 9, 17, 18, 19]
  hourly_weights:
    5: 2
    6: 8
    7: 14
    8: 16
    9: 12
    10: 10
    11: 9
    12: 8
    13: 9
    14: 10
    15: 10
    16: 12
    17: 15
    18: 14
    19: 10
    20: 7
    21: 5
    22: 3

# D6 — operational constants. Single source of truth, loaded via
# `_common/airport_config.py`. Tuning an airport is editing this file.
# Walking/apron speeds in m/min; cascade_max_depth caps incident + turnaround
# delay propagation; weather_capacity = per-category runway rates; the wind
# thresholds/reductions apply the published reductions when wind exceeds the
# threshold (crosswind > 25kt → ×0.85, > 35kt → ×0.60, tailwind > 10kt → ×0.70).
operations:
  walking_speed_m_min: 84.0
  apron_speed_m_min: 83.3
  cascade_max_depth: 5
  weather_capacity:
    CAVOK: { arrival: 32, departure: 32, runways: 2 }
    VMC:   { arrival: 28, departure: 28, runways: 2 }
    IMC:   { arrival: 18, departure: 16, runways: 1 }
    LIFR:  { arrival: 8,  departure: 6,  runways: 1 }
  wind_thresholds_kt:
    crosswind: 25
    crosswind_heavy: 35
    tailwind: 10
  wind_reductions:
    crosswind: 0.85
    crosswind_heavy: 0.60
    tailwind: 0.70

flight_types:
  domestic: 0.42
  international_short: 0.28
  international_long: 0.18
  cargo: 0.08
  charter: 0.04

airlines:
  - code: "AX"
    name: "Artex Airways"
    market_share: 0.22
    hub_terminal: "B"
