identity:
  name: "Arthur International Airport"
  iata: "ART"
  icao: "KART"
  timezone: "America/Arthur"

infrastructure:
  terminals: 3
  gates_per_terminal: [14, 14, 14]
  runways:
    - id: "09L/27R"
      length_m: 3500
      ils: true
    - id: "09R/27L"
      length_m: 3500
      ils: false

# 1C — accessibility & special assistance pool sizing.
# total_per_terminal: number of wheelchairs (and dispatch agents implied)
# sla_target_pct: ECAC Doc 30 — 90% of SA pax should reach the gate before
#                 the boarding cutoff (T-15 by default).
# boarding_cutoff_minutes: minutes before scheduled departure used as the SLA
#                          deadline for SA passengers reaching the gate.
accessibility:
  total_per_terminal: { A: 8, B: 12, C: 8 }
  sla_target_pct: 90.0
  boarding_cutoff_minutes: 15
  max_dispatch_wait_minutes: 30

simulation:
  daily_flight_target: 420
  load_factor_mean: 0.80
  peak_hours: [7, 8, 9, 17, 18, 19]
  hourly_weights:
    5: 2
    6: 8
    7: 14
    8: 16
    9: 12
    10: 10
    11: 9
    12: 8
    13: 9
    14: 10
    15: 10
    16: 12
    17: 15
    18: 14
    19: 10
    20: 7
    21: 5
    22: 3

# D6 — operational constants. Single source of truth, loaded via
# `_common/airport_config.py`. Tuning an airport is editing this file.
# Walking/apron speeds in m/min; cascade_max_depth caps incident + turnaround
# delay propagation; weather_capacity = per-category runway rates; the wind
# thresholds/reductions apply the published reductions when wind exceeds the
# threshold (crosswind > 25kt → ×0.85, > 35kt → ×0.60, tailwind > 10kt → ×0.70).
operations:
  # RC6 — checked-bag volume and baggage-handling throughput, sized together.
  # bags_per_pax = Poisson λ of checked bags per passenger by flight type (no
  # one-bag floor). Throughputs in items/hour; each terminal's screening
  # capacity is split over its screening units. Seeding warns when peak hourly
  # bags exceed capacity_headroom × the slowest stage (SIMULATION.md §3).
  baggage:
    bags_per_pax:
      domestic: 0.6
      international_short: 0.8
      international_long: 1.1
      charter: 1.0
      cargo: 0.0
    default_bags_per_pax: 0.8
    max_bags_per_pax: 5
    induction_per_terminal_hr: { A: 1800, B: 3000, C: 1800 }
    screening_per_terminal_hr: { A: 1800, B: 3000, C: 1800 }
    screening_units_per_terminal: 2
    sorting_matrix_hr: 5400
    makeup_carousel_hr: 150
    arrival_belt_hr: 2400
    capacity_headroom: 0.85
  # RC5: default open security lanes per terminal at 180 pax/h/lane. B hosts the
  # hub carrier (~55–60% of peak departures). SECURITY_LANES_OPEN overrides all.
  security_lanes_open: { A: 8, B: 12, C: 8 }
  effects:
    security_pax_per_lane_minute: 3.0
    prediction_horizon_minutes: 30
    success_probability: 0.8
    gate_slack_minutes: 8.0
    lane_cost: 20.0
    baggage_cost: 12.0
    incident_cost: 30.0
    cost_floor: 5.0
    calibration_prior_strength: 5.0
    calibration_factor_min: 0.25
    calibration_factor_max: 2.0
  walking_speed_m_min: 84.0
  apron_speed_m_min: 83.3
  cascade_max_depth: 5
  weather_capacity:
    CAVOK: { arrival: 32, departure: 32, runways: 2 }
    VMC:   { arrival: 28, departure: 28, runways: 2 }
    IMC:   { arrival: 18, departure: 16, runways: 1 }
    LIFR:  { arrival: 8,  departure: 6,  runways: 1 }
  wind_thresholds_kt:
    crosswind: 25
    crosswind_heavy: 35
    tailwind: 10
  wind_reductions:
    crosswind: 0.85
    crosswind_heavy: 0.60
    tailwind: 0.70

flight_types:
  domestic: 0.42
  international_short: 0.28
  international_long: 0.18
  cargo: 0.08
  charter: 0.04

airlines:
  - code: "AX"
    name: "Artex Airways"
    market_share: 0.22
    hub_terminal: "B"
